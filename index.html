<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShatteredPixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #050505;
    --color-text: #f0f0f0;
    --color-text-dim: #888888;
    --color-accent: #ff3333;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(255, 255, 255, 0.07);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html { height: 100%; }
  body {
    min-height: 100%;
    background-color: var(--color-bg);
    font-family: 'Inter', sans-serif;
    color: var(--color-text);
    overflow-y: auto;
    line-height: 1.6;
  }

  /* ===== BACKGROUND LAYERS (Fixed) ===== */
  .bg-layer { position: fixed; inset: 0; pointer-events: none; }
  .bg-base { z-index: 1; background-color: var(--color-bg); }
  .bg-red { z-index: 2; background: radial-gradient(ellipse 60% 70% at 20% 40%, #ff0000 0%, #990000 50%, transparent 70%), radial-gradient(ellipse 50% 60% at 70% 80%, #e60000 0%, #800000 40%, transparent 70%); opacity: 0.7; animation: redPulse 18s ease-in-out infinite alternate; }
  .bg-gray { z-index: 3; background: radial-gradient(ellipse 50% 60% at 75% 30%, #ffffff 0%, #808080 45%, transparent 70%), radial-gradient(ellipse 40% 50% at 30% 85%, #f0f0f0 0%, #999999 30%, transparent 65%); opacity: 0.5; animation: grayDrift 22s ease-in-out infinite alternate; }
  .bg-mauve { z-index: 4; background: radial-gradient(circle at 60% 50%, #c8a0a0 0%, transparent 30%), radial-gradient(circle at 25% 70%, #b08080 0%, transparent 25%); opacity: 0.3; animation: mauveFloat 26s ease-in-out infinite alternate; }
  .bg-noise { z-index: 5; opacity: 0.03; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>"); }

  @keyframes redPulse { 0% { transform: scale(1) translate(0, 0); opacity: 0.7; } 100% { transform: scale(1.05) translate(-1%, 1%); opacity: 0.75; } }
  @keyframes grayDrift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 1.5%); } }
  @keyframes mauveFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(1.5%, -1.5%) scale(1.03); } }

  /* ===== LAYOUT & TYPOGRAPHY ===== */
  .container {
    position: relative; z-index: 10;
    max-width: 640px; margin: 0 auto; padding: 60px 24px;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    font-weight: 700; letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 0%, #ff4444 60%, #c8a0a0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; color: var(--color-text-dim);
    letter-spacing: 0.05em; text-transform: uppercase;
    margin-bottom: 48px; padding-left: 2px;
  }

  .menu-grid { display: flex; flex-direction: column; gap: 16px; }

  /* ===== GLASSMORPHISM CARDS ===== */
  .menu-card {
    background: var(--glass-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 24px;
    text-decoration: none; color: var(--color-text);
    display: flex; align-items: center; gap: 20px;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative; overflow: hidden;
  }

  .menu-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    transform: translateX(-100%); transition: transform 0.6s ease;
  }

  .menu-card:hover {
    background: var(--glass-hover);
    border-color: rgba(255, 51, 51, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  .menu-card:hover::before { transform: translateX(100%); }

  .icon-box {
    width: 48px; height: 48px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--color-text);
  }
  
  .icon-box svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .menu-info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem; font-weight: 500; margin-bottom: 4px;
  }

  .menu-info p {
    font-size: 0.9rem; color: var(--color-text-dim); font-weight: 300;
  }

  .card-disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
  <div class="bg-layer bg-base"></div>
  <div class="bg-layer bg-red"></div>
  <div class="bg-layer bg-gray"></div>
  <div class="bg-layer bg-mauve"></div>
  <div class="bg-layer bg-noise"></div>

  <div class="container">
    <h1 class="brand">ShatteredPixel</h1>
    <p class="tagline">// digital artifacts & savedata repository</p>

    <div class="menu-grid">
      <!-- Menu 1: Active -->
      <a href="menu1.html" class="menu-card">
        <div class="icon-box">
          <!-- SVG Floppy Disk / Save Icon -->
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </div>
        <div class="menu-info">
          <h3>Savedata</h3>
          <p>Game saves, configurations, and video previews.</p>
        </div>
      </a>
      
      <!-- Menu 2: Placeholder -->
      <div class="menu-card card-disabled">
        <div class="icon-box">
          <!-- SVG Lock Icon -->
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div class="menu-info">
          <h3>Restricted Access</h3>
          <p>Module initialization pending...</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
